[workspace]
resolver = "3"
members = [
    "rs/p2p",
    "rs/registry",
    "rs/orchestrator",
    "rs/syncio-cli",
    "rs/file-manager",
    "rs/interfaces",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# workspace members
interfaces = { path = "rs/interfaces" }
orchestrator = { path = "rs/orchestrator" }
registry = { path = "rs/registry" }
file-manager = { path = "rs/file-manager" }
p2p = { path = "rs/p2p" }

bytes = "1.11.1"
clap = { version = "4.5.60" }
iroh = "0.96.1"
mockall = "0.14.0"
notify = { version = "8.2.0" }
serde = { version = "1.0.228" }
tempfile = "3.23.0"
tokio = { version = "1.49.0", features = ["full"] }
tracing = { version = "0.1.44" }
